[package]
name = "moonwitness-cockpit"
version = "0.1.0"
description = "MOONWITNESS COCKPIT Desktop Runtime"
authors = ["BRIDGE-ALLAH / RIOTWORKS"]
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }

[[bin]]
name = "cockpit-daemon"
path = "src/main.rs"

