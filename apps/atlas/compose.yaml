services:
  postgres:
    image: postgres:17-alpine
    networks:
      - atlas_internal
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in the environment}
      POSTGRES_DB: postgres
      ATLAS_DB_PASSWORD: ${ATLAS_DB_PASSWORD:?Set ATLAS_DB_PASSWORD in the environment}
      RADIUS_DB_PASSWORD: ${RADIUS_DB_PASSWORD:?Set RADIUS_DB_PASSWORD in the environment}
    volumes:
      - atlas_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init/20-create-databases.sh:/docker-entrypoint-initdb.d/20-create-databases.sh:ro
      - ./docker/postgres/init/21-install-radius-schema.sh:/docker-entrypoint-initdb.d/21-install-radius-schema.sh:ro
      - ./docker/freeradius/postgresql/schema.sql:/tmp/atlas-radius-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    networks:
      - atlas_internal

    environment:
      ATLAS_REDIS_PASSWORD: ${ATLAS_REDIS_PASSWORD:?Set ATLAS_REDIS_PASSWORD in the environment}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$ATLAS_REDIS_PASSWORD\""]
    volumes:
      - atlas_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$ATLAS_REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    networks:
      - atlas_internal

    command:
      - --storageDataPath=/storage
      - --httpListenAddr=:8428
    volumes:
      - atlas_victoriametrics_data:/storage
    ports:
      - "127.0.0.1:${VICTORIA_METRICS_PORT:-8428}:8428"
    restart: unless-stopped

  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0
    networks:
      - atlas_internal

    command:
      - --storageDataPath=/victoria-logs-data
      - --httpListenAddr=:9428
    volumes:
      - atlas_victorialogs_data:/victoria-logs-data
    ports:
      - "127.0.0.1:${VICTORIA_LOGS_PORT:-9428}:9428"
    restart: unless-stopped

  freeradius:
    build:
      context: .
      dockerfile: docker/freeradius/Dockerfile
    environment:
      RADIUS_DB_PASSWORD: ${RADIUS_DB_PASSWORD:?Set RADIUS_DB_PASSWORD in the environment}
      RADIUS_STATUS_SECRET: ${RADIUS_STATUS_SECRET:?Set RADIUS_STATUS_SECRET in the environment}
    ports:
      - "${RADIUS_BIND_ADDRESS:-127.0.0.1}:${RADIUS_AUTH_PORT:-1812}:1812/udp"
      - "${RADIUS_BIND_ADDRESS:-127.0.0.1}:${RADIUS_ACCT_PORT:-1813}:1813/udp"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "printf 'FreeRADIUS-Statistics-Type = 1\\nMessage-Authenticator = 0x00\\n' | radclient -q -S /run/freeradius-status-secret 127.0.0.1:18121 status"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      atlas_internal:
        ipv4_address: 172.31.240.20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/atlas-migrate"]
    command: []
    environment:
      DATABASE_URL: postgres://atlas:${ATLAS_DB_PASSWORD}@postgres:5432/atlas
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - atlas_internal
    restart: "no"

  atlas:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      LOCO_ENV: production
      PORT: 5150
      BINDING: 0.0.0.0
      ATLAS_PUBLIC_URL: ${ATLAS_PUBLIC_URL:-http://localhost:5150}
      DATABASE_URL: postgres://atlas:${ATLAS_DB_PASSWORD}@postgres:5432/atlas
      REDIS_URL: redis://:${ATLAS_REDIS_PASSWORD}@redis:6379/0
      RADIUS_DATABASE_URL: postgres://radius:${RADIUS_DB_PASSWORD}@postgres:5432/radius
      ATLAS_CONTROL_TOKEN: ${ATLAS_CONTROL_TOKEN:?Set ATLAS_CONTROL_TOKEN in the environment}
      ATLAS_ENGINE_SECRET_RADIUS_STATUS: ${RADIUS_STATUS_SECRET:?Set RADIUS_STATUS_SECRET in the environment}
      ATLAS_ENGINE_SECRET_PDNS_PRIMARY: ${POWERDNS_API_KEY:-}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
    ports:
      - "127.0.0.1:${ATLAS_PORT:-5150}:5150"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      freeradius:
        condition: service_healthy
    networks:
      atlas_internal:
        ipv4_address: 172.31.240.10
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:5150/api/v1/system/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

networks:
  atlas_internal:
    driver: bridge
    ipam:
      config:
        - subnet: ${ATLAS_DOCKER_SUBNET:-172.31.240.0/24}

volumes:
  atlas_postgres_data:
    driver: local
  atlas_redis_data:
    driver: local
  atlas_victoriametrics_data:
    driver: local
  atlas_victorialogs_data:
    driver: local
