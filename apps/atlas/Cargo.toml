[workspace]

[package]
name = "atlas"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
default-run = "atlas-cli"
description = "MOONWITNESS DNS, RADIUS, and observability control plane"

[dependencies]
async-trait = "0.1"
axum = "0.8"
loco-rs = { version = "1.3.1", default-features = false, features = ["cli"] }
redis = { version = "0.32.7", default-features = false, features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "derive", "json", "migrate", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
subtle = "2"
ulid = "1"
ipnet = "2"
bcrypt = "0.17"
md4 = "0.10"
hex = "0.4"
tokio = { version = "1.45", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time", "process", "fs", "io-util"] }
tracing = "0.1"

[[bin]]
name = "atlas-cli"
path = "src/bin/main.rs"

[dev-dependencies]

[[bin]]
name = "atlas-migrate"
path = "src/bin/migrate.rs"
