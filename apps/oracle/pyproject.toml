[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "moonwitness-oracle"
version = "0.1.0"
description = "Python intelligence and computation service for the MOONWITNESS ecosystem"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{ name = "MOONWITNESS" }]
dependencies = [
  "fastapi>=0.128,<1.0",
  "pydantic>=2.8,<3.0",
  "uvicorn>=0.30,<1.0",
  "asyncpg>=0.32,<0.33",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<10.0",
  "ruff>=0.11,<1.0",
]

[project.scripts]
oracle = "oracle.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
