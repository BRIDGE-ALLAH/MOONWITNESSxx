version: '3.9'

services:
  # PostgreSQL database — local development service
  postgres:
    image: postgres:16-alpine
    container_name: moonwitness-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moonwitness}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=en_US.UTF-8'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-moonwitness}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moonwitness
    restart: unless-stopped

  # Redis for queue/cache (optional — used by BullMQ if needed)
  redis:
    image: redis:7-alpine
    container_name: moonwitness-redis
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moonwitness
    restart: unless-stopped

  # ORACLE computation service — private to the MOONWITNESS bridge network
  oracle:
    build:
      context: ./apps/oracle
      dockerfile: Dockerfile
    container_name: moonwitness-oracle
    environment:
      ORACLE_ENV: development
      ORACLE_HOST: 0.0.0.0
      ORACLE_PORT: 8010
      ORACLE_SERVICE_TOKEN: ${ORACLE_SERVICE_TOKEN:?ORACLE_SERVICE_TOKEN must be set}
    networks:
      - moonwitness
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ARSY backend — Fastify application
  arsy:
    build:
      context: .
      dockerfile: Dockerfile.arsy
    container_name: moonwitness-arsy
    command: ['pnpm', 'dev']
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # ARSY always listens on the internal container port; ARSY_PORT is host-only.
      PORT: 3001
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ARSY_OPERATOR_ID: ${ARSY_OPERATOR_ID:-}
      ARSY_OPERATOR_TOKEN: ${ARSY_OPERATOR_TOKEN:-}
      DOCKER_CREDENTIALS_ENCRYPTION_KEY: ${DOCKER_CREDENTIALS_ENCRYPTION_KEY:-}
      DOCKER_REMOTE_ALLOWED_HOSTS: ${DOCKER_REMOTE_ALLOWED_HOSTS:-}
      DOCKER_REMOTE_ALLOW_PRIVATE_NETWORKS: ${DOCKER_REMOTE_ALLOW_PRIVATE_NETWORKS:-0}
      DOCKER_LOCAL_SOCKET_PATH: ${DOCKER_LOCAL_SOCKET_PATH:-/var/run/docker.sock}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-moonwitness}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ORACLE_BASE_URL: http://oracle:8010
      ORACLE_SERVICE_TOKEN: ${ORACLE_SERVICE_TOKEN:?ORACLE_SERVICE_TOKEN must be set}
      ORACLE_REQUEST_TIMEOUT_MS: ${ORACLE_REQUEST_TIMEOUT_MS:-5000}
    ports:
      - '127.0.0.1:${ARSY_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      oracle:
        condition: service_healthy
    volumes:
      - ./apps/arsy:/app/apps/arsy
      # Source mounts hide image node_modules; preserve pnpm's package-local dependency links.
      - /app/apps/arsy/node_modules
      - ./packages:/app/packages
      - /app/packages/arsy-core/node_modules
      - /app/node_modules
    networks:
      - moonwitness
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Headquarter frontend — Next.js application
  headquarter:
    build:
      context: .
      dockerfile: Dockerfile.headquarter
    container_name: moonwitness-headquarter
    command: ['pnpm', 'dev']
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Headquarter always listens on the internal container port; HEADQUARTER_PORT is host-only.
      PORT: 3000
      NEXT_PUBLIC_ARSY_URL: ${NEXT_PUBLIC_ARSY_URL:-http://arsy:3001}
      ARSY_API_BASE_URL: ${ARSY_API_BASE_URL:-http://arsy:3001}
      ARSY_OPERATOR_ID: ${ARSY_OPERATOR_ID:-}
      ARSY_OPERATOR_TOKEN: ${ARSY_OPERATOR_TOKEN:-}
      HEADQUARTER_OPERATOR_PASSWORD: ${HEADQUARTER_OPERATOR_PASSWORD:-}
      HEADQUARTER_SESSION_SECRET: ${HEADQUARTER_SESSION_SECRET:-}
      HEADQUARTER_PUBLIC_ORIGIN: ${HEADQUARTER_PUBLIC_ORIGIN:-http://localhost:3000}
      HEADQUARTER_TRUSTED_PROXY_HOPS: ${HEADQUARTER_TRUSTED_PROXY_HOPS:-0}
    ports:
      - '127.0.0.1:${HEADQUARTER_PORT:-3000}:3000'
    depends_on:
      arsy:
        condition: service_healthy
    volumes:
      - ./apps/headquarter:/app/apps/headquarter
      # Preserve app and shared-package dependency links hidden by the source mounts.
      - /app/apps/headquarter/node_modules
      - ./packages:/app/packages
      - /app/packages/ui/node_modules
      - /app/packages/assets/node_modules
      - /app/node_modules
    networks:
      - moonwitness
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  moonwitness:
    driver: bridge
