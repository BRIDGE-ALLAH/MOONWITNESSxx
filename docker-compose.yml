services:
  # Local development infrastructure. Do not use committed defaults in production.
  postgres:
    image: postgres:16-alpine
    container_name: moonwitness-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moonwitness}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=en_US.UTF-8'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-moonwitness}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moonwitness
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: moonwitness-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moonwitness
    restart: unless-stopped

  arsy:
    build:
      context: .
      dockerfile: Dockerfile.arsy
    container_name: moonwitness-arsy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: ${ARSY_PORT:-3001}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-moonwitness}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - '${ARSY_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - moonwitness
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  headquarter:
    build:
      context: .
      dockerfile: Dockerfile.headquarter
    container_name: moonwitness-headquarter
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${HEADQUARTER_PORT:-3000}
      NEXT_PUBLIC_ARSY_URL: ${NEXT_PUBLIC_ARSY_URL:-http://arsy:3001}
    ports:
      - '${HEADQUARTER_PORT:-3000}:3000'
    depends_on:
      arsy:
        condition: service_healthy
    networks:
      - moonwitness
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  moonwitness:
    driver: bridge
