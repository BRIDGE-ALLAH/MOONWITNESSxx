version: '3.9'

services:
  # PostgreSQL database — local development service
  postgres:
    image: postgres:16-alpine
    container_name: moonwitness-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moonwitness}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=en_US.UTF-8'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-moonwitness}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moonwitness
    restart: unless-stopped

  # Redis for queue/cache (optional — used by BullMQ if needed)
  redis:
    image: redis:7-alpine
    container_name: moonwitness-redis
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moonwitness
    restart: unless-stopped

  # ARSY backend — Fastify application
  arsy:
    build:
      context: .
      dockerfile: Dockerfile.arsy
    container_name: moonwitness-arsy
    command: ['pnpm', 'dev']
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${ARSY_PORT:-3001}
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-moonwitness}
      ARSY_OPERATOR_ID: ${ARSY_OPERATOR_ID:?ARSY_OPERATOR_ID must be set}
      ARSY_OPERATOR_TOKEN: ${ARSY_OPERATOR_TOKEN:?ARSY_OPERATOR_TOKEN must be set}
      ASSET_STORAGE_DRIVER: ${ASSET_STORAGE_DRIVER:-local}
      ASSET_STORAGE_PATH: ${ASSET_STORAGE_PATH:-/var/lib/arsy/assets}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - '127.0.0.1:${ARSY_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/arsy:/app/apps/arsy
      - ./packages:/app/packages
      - /app/node_modules
      - arsy_assets_data:/var/lib/arsy/assets
    networks:
      - moonwitness
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Headquarter frontend — Next.js application
  headquarter:
    build:
      context: .
      dockerfile: Dockerfile.headquarter
    container_name: moonwitness-headquarter
    command: ['pnpm', 'dev']
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${HEADQUARTER_PORT:-3000}
      NEXT_PUBLIC_ARSY_URL: ${NEXT_PUBLIC_ARSY_URL:-http://arsy:3001}
      ARSY_API_BASE_URL: ${ARSY_API_BASE_URL:-http://arsy:3001}
      ARSY_OPERATOR_ID: ${ARSY_OPERATOR_ID:?ARSY_OPERATOR_ID must be set}
      ARSY_OPERATOR_TOKEN: ${ARSY_OPERATOR_TOKEN:?ARSY_OPERATOR_TOKEN must be set}
      HEADQUARTER_OPERATOR_PASSWORD: ${HEADQUARTER_OPERATOR_PASSWORD:?HEADQUARTER_OPERATOR_PASSWORD must be set}
      HEADQUARTER_SESSION_SECRET: ${HEADQUARTER_SESSION_SECRET:?HEADQUARTER_SESSION_SECRET must be set}
      HEADQUARTER_PUBLIC_ORIGIN: ${HEADQUARTER_PUBLIC_ORIGIN:-http://localhost:3000}
    ports:
      - '127.0.0.1:${HEADQUARTER_PORT:-3000}:3000'
    depends_on:
      arsy:
        condition: service_healthy
    volumes:
      - ./apps/headquarter:/app/apps/headquarter
      - ./packages:/app/packages
      - /app/node_modules
    networks:
      - moonwitness
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  arsy_assets_data:
    driver: local

networks:
  moonwitness:
    driver: bridge
