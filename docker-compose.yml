version: '3.9'

services:
  # PostgreSQL database — local development service
  postgres:
    image: postgres:16-alpine
    container_name: moonwitness-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moonwitness}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=en_US.UTF-8'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-moonwitness}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moonwitness
    restart: unless-stopped

  # Redis for queue/cache (optional — used by BullMQ if needed)
  redis:
    image: redis:7-alpine
    container_name: moonwitness-redis
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moonwitness
    restart: unless-stopped

  # ARSY backend — Fastify application
  arsy:
    build:
      context: .
      dockerfile: Dockerfile.arsy
    container_name: moonwitness-arsy
    command: ['pnpm', 'dev']
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # ARSY always listens on the internal container port; ARSY_PORT is host-only.
      PORT: 3001
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-moonwitness}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - '127.0.0.1:${ARSY_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/arsy:/app/apps/arsy
      # Source mounts hide image node_modules; preserve pnpm's package-local dependency links.
      - /app/apps/arsy/node_modules
      - ./packages:/app/packages
      - /app/packages/arsy-core/node_modules
      - /app/node_modules
    networks:
      - moonwitness
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AEGIS executes network operations authorized by ARSY; it is not a control plane.
  aegis:
    build:
      context: ./apps/aegis
      dockerfile: Dockerfile
    image: moonwitness-aegis:local
    container_name: moonwitness-aegis
    environment:
      AEGIS_HOST: 0.0.0.0
      AEGIS_PORT: 3102
      AEGIS_READ_HEADER_TIMEOUT: ${AEGIS_READ_HEADER_TIMEOUT:-5s}
      AEGIS_SHUTDOWN_TIMEOUT: ${AEGIS_SHUTDOWN_TIMEOUT:-10s}
    ports:
      - '127.0.0.1:${AEGIS_PORT:-3102}:3102'
    networks:
      - moonwitness
    restart: unless-stopped
    healthcheck:
      test: ['CMD', '/aegis', 'healthcheck']
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid

  # Headquarter frontend — Next.js application
  headquarter:
    build:
      context: .
      dockerfile: Dockerfile.headquarter
    container_name: moonwitness-headquarter
    command: ['pnpm', 'dev']
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Headquarter always listens on the internal container port; HEADQUARTER_PORT is host-only.
      PORT: 3000
      NEXT_PUBLIC_ARSY_URL: ${NEXT_PUBLIC_ARSY_URL:-http://arsy:3001}
    ports:
      - '127.0.0.1:${HEADQUARTER_PORT:-3000}:3000'
    depends_on:
      arsy:
        condition: service_healthy
    volumes:
      - ./apps/headquarter:/app/apps/headquarter
      # Preserve app and shared-package dependency links hidden by the source mounts.
      - /app/apps/headquarter/node_modules
      - ./packages:/app/packages
      - /app/packages/ui/node_modules
      - /app/packages/assets/node_modules
      - /app/node_modules
    networks:
      - moonwitness
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  moonwitness:
    driver: bridge
