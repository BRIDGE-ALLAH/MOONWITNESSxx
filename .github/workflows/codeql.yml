name: CodeQL

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '20 19 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

      - name: Copy SARIF into the workspace
        if: always()
        run: |
          if [ -f ../results/javascript.sarif ]; then cp ../results/javascript.sarif ./codeql-results.sarif; fi

      - name: Print CodeQL finding summary
        if: always()
        run: |
          if [ -f codeql-results.sarif ]; then
            node --input-type=module -e "import { readFileSync } from 'node:fs'; const sarif=JSON.parse(readFileSync('codeql-results.sarif','utf8')); for (const run of sarif.runs ?? []) for (const result of run.results ?? []) console.log(JSON.stringify({ruleId:result.ruleId,level:result.level,message:result.message?.text,locations:result.locations?.map(x=>x.physicalLocation?.artifactLocation?.uri+':'+x.physicalLocation?.region?.startLine)}));"
          fi

      - name: Retain SARIF for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: codeql-results.sarif
          if-no-files-found: warn
          retention-days: 3
