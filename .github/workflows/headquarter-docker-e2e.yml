name: Headquarter Docker connector browser E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/arsy/**'
      - 'apps/headquarter/**'
      - 'docker-compose.docker-socket.yml'
      - '.github/workflows/headquarter-docker-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headquarter-docker-browser-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-browser-e2e:
    name: Docker registration, inventory, logs and reload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moonwitness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moonwitness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/moonwitness_test
      ARSY_OPERATOR_ID: docker-browser-e2e-operator
      ARSY_OPERATOR_TOKEN: docker-browser-e2e-only-token-not-for-deployment
      ARSY_API_BASE_URL: http://127.0.0.1:3001
      DOCKER_LOCAL_SOCKET_PATH: /var/run/docker.sock
      HEADQUARTER_OPERATOR_PASSWORD: docker-browser-e2e-only-password-32chars
      HEADQUARTER_SESSION_SECRET: docker-browser-e2e-only-session-secret-at-least-32-bytes
      HEADQUARTER_PUBLIC_ORIGIN: http://127.0.0.1:3000
      HEADQUARTER_E2E_URL: http://127.0.0.1:3000
      HEADQUARTER_TRUSTED_PROXY_HOPS: "0"
      NEXT_PUBLIC_ARSY_URL: http://127.0.0.1:3001
      HOST: 127.0.0.1
      PORT: 3001
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the real runner Docker daemon and PostgreSQL service
        run: |
          docker info
          docker ps --format '{{.ID}} {{.Names}}'

      - name: Apply the Docker connector migration to isolated PostgreSQL
        working-directory: apps/arsy
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          import { Pool } from 'pg'

          const pool = new Pool({ connectionString: process.env.DATABASE_URL })
          try {
            const dockerMigration = await readFile('migrations/002_docker_connector.sql', 'utf8')
            const loginThrottleMigration = await readFile('migrations/006_shared_login_attempts.sql', 'utf8')
            await pool.query(dockerMigration)
            await pool.query(loginThrottleMigration)
          } finally {
            await pool.end()
          }
          NODE

      - name: Start ARSY and Headquarter against isolated PostgreSQL and the runner Docker socket
        run: |
          nohup pnpm --filter @riotworks/arsy dev > "$RUNNER_TEMP/arsy-docker-e2e.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/arsy-docker-e2e.pid"
          nohup pnpm --filter @riotworks/headquarter exec next dev --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/headquarter-docker-e2e.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/headquarter-docker-e2e.pid"

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3001/health/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then
              echo "ARSY and Headquarter are responding."
              exit 0
            fi
            sleep 2
          done

          echo "Timed out waiting for ARSY or Headquarter."
          cat "$RUNNER_TEMP/arsy-docker-e2e.log" || true
          cat "$RUNNER_TEMP/headquarter-docker-e2e.log" || true
          exit 1

      - name: Install pinned Playwright runner outside the workspace
        run: |
          mkdir -p "$RUNNER_TEMP/playwright"
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save --no-audit --no-fund playwright@1.65.0
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify real browser-to-Docker-to-PostgreSQL workflow
        env:
          PLAYWRIGHT_PACKAGE_PATH: ${{ runner.temp }}/playwright/node_modules/playwright
        run: node --experimental-strip-types --test apps/headquarter/tests/docker-connector.browser.e2e.mjs

      - name: Upload application logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: headquarter-docker-browser-e2e-logs
          path: |
            ${{ runner.temp }}/arsy-docker-e2e.log
            ${{ runner.temp }}/headquarter-docker-e2e.log
          if-no-files-found: ignore
          retention-days: 7
