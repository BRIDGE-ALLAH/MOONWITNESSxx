name: Headquarter browser E2E

on:
  pull_request:
    branches: [main, "feat-*", "feat/**"]
  push:
    branches: ["feat/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headquarter-browser-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    name: Headquarter operator and persistence journey
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arsy
          POSTGRES_PASSWORD: arsy_test_password
          POSTGRES_DB: arsy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arsy -d arsy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: development
      DATABASE_URL: postgres://arsy:arsy_test_password@127.0.0.1:5432/arsy_test
      ARSY_OPERATOR_ID: e2e-isolated-operator
      ARSY_OPERATOR_TOKEN: e2e-only-operator-token-not-for-deployment
      ARSY_ASSET_STORAGE_DIR: /tmp/moonwitness-e2e-assets
      ARSY_API_BASE_URL: http://127.0.0.1:3001
      HEADQUARTER_OPERATOR_PASSWORD: e2e-only-operator-password-32-characters
      HEADQUARTER_SESSION_SECRET: e2e-only-session-secret-at-least-32-bytes
      HEADQUARTER_PUBLIC_ORIGIN: http://127.0.0.1:3000
      HEADQUARTER_E2E_URL: http://127.0.0.1:3000
      HOST: 127.0.0.1
      PORT: 3001
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm --filter @riotworks/arsy migrate:up

      - name: Start ARSY and Headquarter against isolated PostgreSQL
        run: |
          mkdir -p "$RUNNER_TEMP/moonwitness-e2e-assets"
          nohup pnpm --filter @riotworks/arsy dev > "$RUNNER_TEMP/arsy.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/arsy.pid"
          nohup pnpm --filter @riotworks/headquarter exec next dev --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/headquarter.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/headquarter.pid"

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3001/health/ready >/dev/null               && curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then
              echo "ARSY and Headquarter are responding."
              exit 0
            fi
            sleep 2
          done

          echo "Timed out waiting for the application servers."
          cat "$RUNNER_TEMP/arsy.log" || true
          cat "$RUNNER_TEMP/headquarter.log" || true
          exit 1

      - name: Install pinned Playwright runner outside the workspace
        run: |
          mkdir -p "$RUNNER_TEMP/playwright"
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save --no-audit --no-fund playwright@1.65.0
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify login, browser-to-API wiring, persistence, and anonymous isolation
        env:
          PLAYWRIGHT_PACKAGE_PATH: ${{ runner.temp }}/playwright/node_modules/playwright
        run: node --experimental-strip-types --test apps/headquarter/tests/money-maker.browser.e2e.mjs

      - name: Upload application logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: headquarter-browser-e2e-logs
          path: |
            ${{ runner.temp }}/arsy.log
            ${{ runner.temp }}/headquarter.log
          if-no-files-found: ignore
          retention-days: 7
