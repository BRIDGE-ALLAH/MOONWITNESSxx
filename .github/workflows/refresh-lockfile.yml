name: Refresh pnpm lockfile

on:
  push:
    branches:
      - chore/governance-phase-0-1
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    name: Format commit hook source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Format changed files
        if: github.event_name == 'push'
        env:
          FORMAT_BASE_SHA: 0bdf4290d6c060892f85f6562a41585a2be53e08
          FORMAT_EXCLUDE: .github/workflows/refresh-lockfile.yml;.github/workflows/ci.yml
        run: pnpm run format
      - name: Commit formatting changes
        if: github.event_name == 'push'
        run: |
          git diff --name-only -z "0bdf4290d6c060892f85f6562a41585a2be53e08...HEAD" | grep -zv "^.github/workflows/" | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format commit hook source [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Regenerate lockfile
        if: github.event_name == 'workflow_dispatch'
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Open or update lockfile pull request
        if: github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore-refresh-pnpm-lockfile
          delete-branch: true
          commit-message: "chore: refresh pnpm lockfile"
          title: "chore: refresh pnpm lockfile"
          body: "Regenerate the lockfile with pinned pnpm 12.16.1; review dependency changes before merging."
          add-paths: pnpm-lock.yaml
