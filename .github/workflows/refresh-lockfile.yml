name: Refresh pnpm lockfile

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "apps/**/package.json"
      - "packages/**/package.json"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: refresh-pnpm-lockfile
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate and propose lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Regenerate lockfile from workspace manifests
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Verify generated lockfile with a frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Open or update lockfile pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore-refresh-pnpm-lockfile
          delete-branch: true
          commit-message: "chore: refresh pnpm lockfile"
          title: "chore: refresh pnpm lockfile"
          body: |
            ## Purpose

            Regenerate the pnpm lockfile from committed workspace manifests using the pinned pnpm version.

            ## Validation

            - Generated with pnpm 12.16.1.
            - A frozen install passed before this PR was opened.
            - No application source files are changed.
            - Review the dependency graph diff before merging.

          add-paths: pnpm-lock.yaml

      # GITHUB_TOKEN-created PR events do not automatically start other workflows.
      # Dispatch the ordinary CI workflow against the generated PR branch explicitly.
      - name: Dispatch CI for generated lockfile branch
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ci.yml --ref chore-refresh-pnpm-lockfile
