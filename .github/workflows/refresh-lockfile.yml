name: Refresh pnpm lockfile

on:
  workflow_dispatch:

concurrency:
  group: refresh-pnpm-lockfile
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Regenerate and propose lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Regenerate lockfile from workspace manifests
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Open or update lockfile pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore-refresh-pnpm-lockfile
          delete-branch: true
          commit-message: "chore: refresh pnpm lockfile"
          title: "chore: refresh pnpm lockfile"
          body: |
            ## Purpose

            Regenerate the pnpm lockfile from committed workspace manifests using the pinned pnpm version.

            ## Validation

            - Generated with pnpm 12.16.1.
            - No application source files are changed.
            - Review the dependency graph diff before merging.
          add-paths: pnpm-lock.yaml
