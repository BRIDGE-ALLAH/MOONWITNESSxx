name: Refresh pnpm lockfile

on:
  # Temporary one-time formatting pass for the isolated governance branch.
  push:
    branches:
      - chore/governance-phase-0-1
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    name: Format changed files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Format changed files on isolated branch
        if: github.event_name == 'push'
        run: |
          export FORMAT_BASE_SHA="$(git merge-base origin/main HEAD)"
          export FORMAT_EXCLUDE=".github/workflows/refresh-lockfile.yml"
          pnpm run format
      - name: Commit formatting changes to isolated branch
        if: github.event_name == 'push'
        run: |
          BASE_SHA="$(git merge-base origin/main HEAD)"
          git diff -- .github/workflows/ci.yml
          git diff --name-only -z "$BASE_SHA...HEAD" | grep -zv "^.github/workflows/ci.yml$" | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format governance changes [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Regenerate lockfile and propose review
        if: github.event_name == 'workflow_dispatch'
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Open or update lockfile pull request
        if: github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore-refresh-pnpm-lockfile
          delete-branch: true
          commit-message: "chore: refresh pnpm lockfile"
          title: "chore: refresh pnpm lockfile"
          body: |
            Regenerate the pnpm lockfile with the pinned pnpm version. Review the dependency graph diff before merging.
          add-paths: pnpm-lock.yaml
