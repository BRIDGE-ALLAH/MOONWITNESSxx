name: Refresh pnpm lockfile

on:
  push:
    branches:
      - chore/governance-phase-0-1
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    name: Refresh lockfile on isolated governance branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Regenerate lockfile
        if: github.event_name == 'push'
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit lockfile update
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): refresh lockfile for current manifests [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Regenerate lockfile for review
        if: github.event_name == 'workflow_dispatch'
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Open or update lockfile pull request
        if: github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore-refresh-pnpm-lockfile
          delete-branch: true
          commit-message: "chore: refresh pnpm lockfile"
          title: "chore: refresh pnpm lockfile"
          body: "Regenerate the lockfile with pinned pnpm 12.16.1; review dependency changes before merging."
          add-paths: pnpm-lock.yaml
