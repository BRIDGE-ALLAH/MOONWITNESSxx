name: Refresh pnpm lockfile

on:
  # One-time Phase 0 recovery on the isolated governance execution branch.
  push:
    branches:
      - chore/governance-phase-0-1
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Regenerate pnpm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Regenerate lockfile from workspace manifests
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit lockfile to isolated execution branch
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): refresh workspace lockfile [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Open or update lockfile pull request
        if: github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore-refresh-pnpm-lockfile
          delete-branch: true
          commit-message: "chore: refresh pnpm lockfile"
          title: "chore: refresh pnpm lockfile"
          body: |
            ## Purpose
            Regenerate the pnpm lockfile from committed workspace manifests using pnpm 12.16.1.

            ## Validation
            - Generated with the pinned pnpm version.
            - No application source files are changed.
            - Review the dependency graph diff before merging.
          add-paths: pnpm-lock.yaml
