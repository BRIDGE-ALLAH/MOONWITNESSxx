name: ORACLE Python checks

on:
  push:
    branches:
      - main
      - "feat-*"
      - "feat/**"
      - "fix-*"
      - "fix/**"
    paths:
      - "apps/oracle/**"
      - ".github/workflows/oracle.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/oracle/**"
      - ".github/workflows/oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle-tests:
    name: ORACLE tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: apps/oracle
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/oracle/pyproject.toml

      - name: Install ORACLE and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check lint
        run: ruff check src tests

      - name: Check formatting
        run: ruff format --check src tests

      - name: Run tests
        run: pytest

      - name: Build ORACLE container
        if: matrix.python-version == '3.13'
        run: docker build -t moonwitness-oracle:ci .

  oracle-postgres-integration:
    name: ORACLE durable PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: oracle_test_admin_password
          POSTGRES_DB: oracle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oracle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:oracle_test_admin_password@localhost:5432/oracle_test
    defaults:
      run:
        working-directory: apps/oracle
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ORACLE and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run durable PostgreSQL integration tests
        run: pytest tests/test_postgres_jobs.py
