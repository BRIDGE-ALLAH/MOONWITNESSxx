name: ORACLE Python checks

on:
  push:
    branches:
      - main
      - "feat-*"
      - "feat/**"
      - "fix-*"
      - "fix/**"
    paths:
      - "apps/oracle/**"
      - ".github/workflows/oracle.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/oracle/**"
      - ".github/workflows/oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle-tests:
    name: ORACLE tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: apps/oracle
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/oracle/pyproject.toml

      - name: Install ORACLE and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check lint
        run: ruff check src tests

      - name: Check formatting
        run: ruff format --check src tests

      - name: Run tests
        run: pytest

      - name: Build ORACLE container
        if: matrix.python-version == '3.13'
        run: docker build -t moonwitness-oracle:ci .
