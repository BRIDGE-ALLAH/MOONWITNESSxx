name: ORACLE Python checks

on:
  push:
    branches:
      - main
      - "feat-*"
      - "feat/**"
      - "fix-*"
      - "fix/**"
    paths:
      - "apps/oracle/**"
      - ".github/workflows/oracle.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/oracle/**"
      - ".github/workflows/oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle-tests:
    name: ORACLE tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oracle
          POSTGRES_PASSWORD: oracle
          POSTGRES_DB: oracle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oracle -d oracle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ORACLE_TEST_DATABASE_URL: postgresql://oracle:oracle@127.0.0.1:5432/oracle_test
      ORACLE_TEST_APP_DATABASE_URL: postgresql://oracle_app:oracle_app_test_password@127.0.0.1:5432/oracle_test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: apps/oracle
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/oracle/pyproject.toml

      - name: Install ORACLE and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Provision isolated least-privilege ORACLE application role
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main():
              connection = await asyncpg.connect("postgresql://oracle:oracle@127.0.0.1:5432/oracle_test")
              try:
                  await connection.execute(
                      "CREATE ROLE oracle_app LOGIN PASSWORD 'oracle_app_test_password' "
                      "NOINHERIT NOCREATEDB NOCREATEROLE NOREPLICATION"
                  )
                  await connection.execute("GRANT CONNECT ON DATABASE oracle_test TO oracle_app")
                  await connection.execute(
                      "CREATE ROLE oracle_migrator NOLOGIN NOCREATEDB NOCREATEROLE NOREPLICATION"
                  )
                  await connection.execute("CREATE SCHEMA oracle AUTHORIZATION oracle_migrator")
                  await connection.execute("GRANT USAGE, CREATE ON SCHEMA oracle TO oracle_migrator")
                  await connection.execute("REVOKE CREATE ON DATABASE oracle_test FROM oracle_app")
                  await connection.execute("REVOKE ALL ON SCHEMA public FROM oracle_app")
                  await connection.execute("REVOKE ALL ON ALL TABLES IN SCHEMA public FROM oracle_app")
                  await connection.execute("REVOKE ALL ON ALL SEQUENCES IN SCHEMA public FROM oracle_app")
              finally:
                  await connection.close()

          asyncio.run(main())
          PY

      - name: Check lint
        run: ruff check src tests

      - name: Check formatting
        run: ruff format --check src tests

      - name: Run tests
        run: pytest

      - name: Build ORACLE container
        if: matrix.python-version == '3.13'
        run: docker build -t moonwitness-oracle:ci .
