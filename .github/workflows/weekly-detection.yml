name: Weekly repository audit

on:
  schedule:
    # Monday 02:30 Asia/Jakarta (Sunday 19:30 UTC).
    - cron: "30 19 * * 0"
  workflow_dispatch:

concurrency:
  group: weekly-repository-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Read-only repository audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate audit report
        run: node scripts/repo-audit.mjs --write-report

      - name: Run governance checks
        run: node scripts/governance.mjs check

      - name: Generate governance coverage report
        run: node scripts/governance.mjs report > .artifacts/governance-report.json

      - name: Run automation tests
        run: node --test

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: moonwitness-weekly-audit-${{ github.run_number }}
          path: .artifacts/
          if-no-files-found: ignore
          retention-days: 30
