name: Temporary formatting preview

on:
  push:
    branches:
      - format-preview

permissions:
  contents: write

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format tracked implementation files
        run: |
          pnpm exec prettier --write --ignore-unknown \
            .github/ISSUE_TEMPLATE/bug_report.yml \
            .github/ISSUE_TEMPLATE/feature_request.yml \
            .github/workflows/ci.yml \
            .github/workflows/codeql.yml \
            .github/workflows/refresh-lockfile.yml \
            .github/workflows/weekly-detection.yml \
            docker-compose.yml \
            docs/developer-installer.md \
            docs/operational-twin-research.md \
            docs/runtime-lifecycle.md \
            governance/README.md \
            scripts/governance.mjs \
            scripts/moonwitness.mjs \
            scripts/moonwitness.test.mjs \
            scripts/runtime.mjs \
            scripts/runtime.test.mjs \
            .github/workflows/format-preview.yml
      - name: Stage formatted output
        run: |
          mkdir -p formatted-output
          while IFS= read -r file; do
            mkdir -p "formatted-output/$(dirname "$file")"
            cp "$file" "formatted-output/$file"
          done <<'FILES'
          .github/ISSUE_TEMPLATE/bug_report.yml
          .github/ISSUE_TEMPLATE/feature_request.yml
          .github/workflows/ci.yml
          .github/workflows/codeql.yml
          .github/workflows/refresh-lockfile.yml
          .github/workflows/weekly-detection.yml
          docker-compose.yml
          docs/developer-installer.md
          docs/operational-twin-research.md
          docs/runtime-lifecycle.md
          governance/README.md
          scripts/governance.mjs
          scripts/moonwitness.mjs
          scripts/moonwitness.test.mjs
          scripts/runtime.mjs
          scripts/runtime.test.mjs
          .github/workflows/format-preview.yml
          FILES
      - name: Commit formatted files to the temporary preview branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/ISSUE_TEMPLATE/bug_report.yml \
            .github/ISSUE_TEMPLATE/feature_request.yml \
            docker-compose.yml \
            docs/developer-installer.md \
            docs/operational-twin-research.md \
            docs/runtime-lifecycle.md \
            governance/README.md \
            scripts/governance.mjs \
            scripts/moonwitness.mjs \
            scripts/moonwitness.test.mjs \
            scripts/runtime.mjs \
            scripts/runtime.test.mjs
          if git diff --cached --quiet; then
            echo 'All targeted files already formatted.'
          else
            git commit -m 'style: apply Prettier formatting to phases 0-5'
            git push origin HEAD:format-preview
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: formatted-moonwitness-files
          path: formatted-output/
          retention-days: 1
          include-hidden-files: true
