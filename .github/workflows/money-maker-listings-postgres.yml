name: Money Maker Channel and Listing PostgreSQL Integration

on:
  pull_request:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'apps/arsy/**'
      - '.github/workflows/money-maker-listings-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: money-maker-listings-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  channels-listings-postgres:
    name: Channel registry and manual listing persistence on PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: moonwitness_test
          POSTGRES_USER: moonwitness_test
          POSTGRES_PASSWORD: moonwitness_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moonwitness_test -d moonwitness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://moonwitness_test:moonwitness_test_password@127.0.0.1:5432/moonwitness_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify channel evidence, manual listing packages and receipts on PostgreSQL
        run: pnpm --filter @riotworks/arsy exec node --experimental-transform-types --test tests/channels-listings-postgres.integration.mjs
