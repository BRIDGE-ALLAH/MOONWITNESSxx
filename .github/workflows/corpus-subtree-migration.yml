name: Corpus subtree migration

on:
  workflow_dispatch:
    inputs:
      source_head:
        description: Exact 40-character Corpus source commit SHA (pin; never use a moving branch)
        required: true
        type: string
        default: "534a21893728de64b5f28f27ea600e8609d7b8c4"
      rights_approved:
        description: Confirm every artifact in this full import is licensed/authorized for this public repository
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  import-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit rights approval
        env:
          RIGHTS_APPROVED: ${{ inputs.rights_approved }}
          SOURCE_HEAD: ${{ inputs.source_head }}
        run: |
          test "$RIGHTS_APPROVED" = "true" || { echo "Rights approval is required; no files were imported."; exit 2; }
          [[ "$SOURCE_HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid source SHA."; exit 2; }

      - name: Checkout target repository with full history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install git-subtree
        run: |
          sudo apt-get update
          sudo apt-get install -y git-subtree

      - name: Configure import identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Import pinned Corpus history
        env:
          CORPUS_SOURCE_HEAD: ${{ inputs.source_head }}
          CORPUS_RIGHTS_APPROVED: ${{ inputs.rights_approved }}
        run: bash scripts/migrate-corpus-subtree.sh

      - name: Push import branch for review
        env:
          SOURCE_HEAD: ${{ inputs.source_head }}
        run: |
          BRANCH="corpus-migration/${SOURCE_HEAD:0:8}"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          echo "Import branch pushed: $BRANCH" >> "$GITHUB_STEP_SUMMARY"
          echo "Open a pull request and complete inventory/hash/Corpus validation before merging." >> "$GITHUB_STEP_SUMMARY"
