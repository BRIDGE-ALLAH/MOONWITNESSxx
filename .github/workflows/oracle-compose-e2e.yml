name: ORACLE Compose E2E

on:
  push:
    branches:
      - main
      - "feat-*"
      - "feat/**"
  pull_request:
    branches:
      - main
      - "feat-*"
      - "feat/**"
    paths:
      - "apps/arsy/**"
      - "apps/oracle/**"
      - "docker-compose.yml"
      - ".env.docker"
      - ".github/workflows/oracle-compose-e2e.yml"
  workflow_dispatch:

concurrency:
  group: oracle-compose-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oracle-compose-e2e:
    name: ORACLE service-to-service E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Create isolated CI operator credentials
        shell: bash
        run: |
          echo "ARSY_OPERATOR_ID=oracle-compose-e2e" >> "$GITHUB_ENV"
          echo "ARSY_OPERATOR_TOKEN=$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")" >> "$GITHUB_ENV"
          echo "ARSY_E2E_BASE_URL=http://127.0.0.1:3001" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose --env-file .env.docker -f docker-compose.yml config --quiet

      - name: Build and start the real service stack
        run: |
          docker compose --env-file .env.docker -f docker-compose.yml \
            up --detach --build --wait --wait-timeout 240 postgres redis oracle arsy

      - name: Exercise ARSY authentication, ORACLE execution, results and idempotency
        run: node --test apps/arsy/e2e/oracle-compose.e2e.test.mjs

      - name: Collect service logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.docker -f docker-compose.yml \
            logs --no-color --tail=200 postgres redis oracle arsy

      - name: Tear down isolated stack and test data
        if: always()
        run: |
          docker compose --env-file .env.docker -f docker-compose.yml \
            down --volumes --remove-orphans
