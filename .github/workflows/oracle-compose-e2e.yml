name: ORACLE Compose E2E

on:
  push:
    branches:
      - main
      - "feat-*"
      - "feat/**"
  pull_request:
    branches:
      - main
      - "feat-*"
      - "feat/**"
    paths:
      - "apps/arsy/**"
      - "apps/oracle/**"
      - "docker-compose.yml"
      - ".env.docker"
      - ".github/workflows/oracle-compose-e2e.yml"
  workflow_dispatch:

concurrency:
  group: oracle-compose-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oracle-compose-e2e:
    name: ORACLE service-to-service E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Create isolated CI operator credentials
        shell: bash
        run: |
          echo "ARSY_OPERATOR_ID=oracle-compose-e2e" >> "$GITHUB_ENV"
          token="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::$token"
          echo "ARSY_OPERATOR_TOKEN=$token" >> "$GITHUB_ENV"
          echo "ARSY_E2E_BASE_URL=http://127.0.0.1:3001" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose --env-file .env.docker -f docker-compose.yml config --quiet

      - name: Start PostgreSQL for explicit schema migration
        run: |
          docker compose --env-file .env.docker -f docker-compose.yml \
            up --detach --wait --wait-timeout 120 postgres oracle-db-bootstrap

      - name: Apply ORACLE job migration explicitly as the database migration owner
        run: |
          docker compose --env-file .env.docker -f docker-compose.yml \
            exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
            < apps/oracle/migrations/001_oracle_jobs.sql

      - name: Build and start the real service stack
        run: |
          docker compose --env-file .env.docker -f docker-compose.yml \
            up --detach --build --wait --wait-timeout 240 redis oracle arsy

      - name: Exercise ARSY authentication, ORACLE execution, results and idempotency
        env:
          ORACLE_E2E_PERSISTENCE_REPORT: /tmp/oracle-persistence-report.json
        run: node --test apps/arsy/e2e/oracle-compose.e2e.test.mjs

      - name: Restart ORACLE and wait for durable service readiness
        run: |
          docker compose --env-file .env.docker -f docker-compose.yml restart oracle
          docker compose --env-file .env.docker -f docker-compose.yml \
            up --detach --wait --wait-timeout 120 oracle

      - name: Verify job result and idempotency survive ORACLE restart
        env:
          ORACLE_E2E_PERSISTENCE_REPORT: /tmp/oracle-persistence-report.json
        run: node --test apps/arsy/e2e/oracle-persistence-restart.e2e.test.mjs

      - name: Collect service logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.docker -f docker-compose.yml \
            logs --no-color --tail=200 postgres oracle-db-bootstrap redis oracle arsy

      - name: Tear down isolated stack and test data
        if: always()
        run: |
          docker compose --env-file .env.docker -f docker-compose.yml \
            down --volumes --remove-orphans
