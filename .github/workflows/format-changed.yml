name: Format changed files

on:
  push:
    branches:
      - main
      - "feat-*"
      - "fix-*"
      - "chore-*"
    paths:
      - ".github/**"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "MASTER-PROMPT"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".prettierrc"
      - ".prettierignore"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: format-changed-files-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    name: Format changed supported files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files only
        run: pnpm run format

      - name: Validate formatter output
        run: git diff --check

      - name: Commit formatting-only changes when needed
        id: commit
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Changed files already satisfy Prettier."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: format changed files"

          # Rebase formatting-only changes onto the latest target branch without force-pushing.
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A GITHUB_TOKEN push does not start ordinary push workflows.
      - name: Dispatch CI after formatting commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: gh workflow run ci.yml --ref "$TARGET_BRANCH"

      - name: Summarize formatting result
        if: always()
        env:
          CHANGED: ${{ steps.commit.outputs.changed }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          {
            echo "## Changed-file formatting"
            echo
            if [ "$CHANGED" = "true" ]; then
              echo "- Result: formatting-only commit pushed to $TARGET_BRANCH."
              echo "- Commit: $COMMIT_SHA"
              echo "- CI: dispatched on $TARGET_BRANCH."
            else
              echo "- Result: no formatting changes were needed on $TARGET_BRANCH."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
