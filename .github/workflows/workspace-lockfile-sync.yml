name: Sync workspace lockfile on feature branches

on:
  push:
    branches:
      - "feat-*"
      - "feat/**"
      - "fix-*"
      - "fix/**"
      - "chore-*"
    paths:
      - "package.json"
      - "pnpm-workspace.yaml"
      - "apps/**/package.json"
      - "packages/**/package.json"

concurrency:
  group: workspace-lockfile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Regenerate workspace lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Regenerate lockfile from manifests
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already matches the workspace manifests."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): sync workspace lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
