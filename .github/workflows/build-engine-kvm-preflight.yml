name: Build Engine KVM host preflight

on:
  pull_request:
    paths:
      - "docs/adr/0003-isolated-build-engine.md"
      - "scripts/build-engine-spike/**"
      - ".github/workflows/build-engine-kvm-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-capability:
    name: Inspect hosted runner KVM prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Report host prerequisites (informational)
        run: bash scripts/build-engine-spike/kvm-host-preflight.sh --report-only
