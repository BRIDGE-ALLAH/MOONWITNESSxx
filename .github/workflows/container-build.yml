name: Container build verification

on:
  pull_request:
    branches: [main, feat/money-maker-mainline-20261108]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    name: Build ARSY and Headquarter images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate local Compose configuration
        run: docker compose --env-file .env.docker config --quiet

      - name: Build ARSY production image
        run: docker build --file Dockerfile.arsy --tag moonwitness-arsy:ci .

      - name: Build Headquarter production image
        run: docker build --file Dockerfile.headquarter --tag moonwitness-headquarter:ci .
