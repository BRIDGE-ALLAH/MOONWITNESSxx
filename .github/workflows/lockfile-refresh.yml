name: Refresh pnpm lockfile

on:
  push:
    branches:
      - "fix/**"
    paths:
      - "apps/arsy/package.json"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Regenerate lockfile without executing package scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Commit lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): update pnpm lockfile for ARSY rate limiting"
            git push
          fi
