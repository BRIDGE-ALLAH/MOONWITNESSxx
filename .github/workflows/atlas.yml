name: ATLAS CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: ATLAS Rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: ci-atlas-test-password
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U atlas -d atlas"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://atlas:ci-atlas-test-password@127.0.0.1:5432/atlas
      RADIUS_DATABASE_URL: postgres://atlas:ci-atlas-test-password@127.0.0.1:5432/radius
    defaults:
      run:
        working-directory: apps/atlas
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/atlas

      - name: Resolve dependencies and generate lockfile
        run: cargo generate-lockfile

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --locked --release

      - name: Validate Docker Compose
        env:
          ATLAS_DB_PASSWORD: ci-atlas-db-password-which-is-over-32-chars
          POSTGRES_ADMIN_PASSWORD: ci-postgres-admin-password-32chars
          ATLAS_REDIS_PASSWORD: ci-atlas-redis-password-which-is-over-32-chars
          RADIUS_DB_PASSWORD: ci-radius-db-password-which-is-long-enough-32chars
          RADIUS_STATUS_SECRET: ci-radius-status-secret-which-is-long-enough-32
          ATLAS_CONTROL_TOKEN: ci-atlas-control-token-which-is-long-enough
          ATLAS_DOCKER_SUBNET: 172.31.240.0/24
        run: docker compose config --quiet

      - name: Build ATLAS container
        run: docker build --tag atlas:ci .

      - name: Build FreeRADIUS image
        run: docker build --file docker/freeradius/Dockerfile --tag atlas-freeradius:ci .

