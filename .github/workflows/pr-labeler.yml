name: Pull request labels

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply path-based labels
        uses: actions/labeler@v7
        with:
          sync-labels: true
