name: Repository CI

on:
  push:
    branches:
      - main
      - "feat-*"
      - "fix-*"
      - "chore-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: repository-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # Run dependency-free Node scripts before pnpm run. pnpm 12 can verify/install
      # dependencies before any script invocation when node_modules is absent.
      - name: Generate repository audit report
        run: node scripts/repo-audit.mjs --write-report

      - name: Check pnpm lockfile
        run: node scripts/check-lockfile.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository, formatting, and automation tests
        run: pnpm run validate:repo

      - name: Upload repository audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: moonwitness-repository-audit
          path: .artifacts/
          if-no-files-found: ignore
          retention-days: 14

  full-workspace-quality:
    name: Full workspace typecheck and build
    if: ${{ vars.FULL_QUALITY_CI == 'true' }}
    needs: repository-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full validation
        run: pnpm run validate
