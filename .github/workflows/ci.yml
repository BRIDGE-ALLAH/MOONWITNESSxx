name: Repository CI

on:
  push:
    branches:
      - main
      - "feat-*"
      - "feat/**"
      - "fix-*"
      - "fix/**"
      - "chore-*"
      - "headquarter/**"
  pull_request:
    branches:
      - main
      - "feat-*"
      - "feat/**"
  workflow_dispatch:

concurrency:
  group: repository-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Generate repository audit report
        run: pnpm run audit:repo

      - name: Check pnpm lockfile
        run: pnpm run lockfile:check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository, formatting, and automation tests
        run: pnpm run validate:repo

      - name: Test ARSY governance primitives
        run: pnpm --filter @riotworks/arsy-core test:governance

      - name: Test ARSY application runtime configuration
        run: pnpm --filter @riotworks/arsy test

      - name: Validate Docker Compose configuration
        run: |
          docker compose --env-file .env.docker -f docker-compose.yml config --quiet
          docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.docker-socket.yml config --quiet

      - name: Test Divine epistemic and provenance suites
        run: pnpm --filter @riotworks/divine test

      - name: Smoke test developer experience commands
        run: |
          pnpm devx doctor --json
          pnpm devx plan --base=HEAD --json
          pnpm devx context --json --max-chars=12000 > /tmp/moonwitness-context.json
          node -e "JSON.parse(require('node:fs').readFileSync('/tmp/moonwitness-context.json', 'utf8'))"

      - name: Test Counterfactual Repo Lab
        run: |
          pnpm run test:repo-lab
          pnpm run repo:lab -- --cycles
          pnpm run repo:lab -- --changed-files packages/divine/src/index.ts

      - name: Upload repository audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moonwitness-repository-audit
          path: .artifacts/
          if-no-files-found: ignore
          retention-days: 14

  developer-experience:
    name: Developer experience
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run developer experience unit tests
        run: pnpm test

      - name: Smoke test developer environment doctor
        run: pnpm devx doctor --json

      - name: Smoke test change-aware planner
        run: pnpm devx plan --base=HEAD --json

      - name: Verify agent context compiler emits valid JSON
        run: |
          pnpm devx context --json --max-chars=12000 > /tmp/moonwitness-context.json
          node -e "JSON.parse(require('node:fs').readFileSync('/tmp/moonwitness-context.json', 'utf8'))"

      - name: Smoke test parallel collision forecast
        run: |
          printf '%s\n' '{"agents":[{"id":"agent-a","writePaths":["packages/a/src"]},{"id":"agent-b","writePaths":["packages/b/src"]}]}' > /tmp/moonwitness-agents.json
          pnpm devx collision --plan-file=/tmp/moonwitness-agents.json

      - name: Smoke test execution flight recorder
        run: |
          printf '%s\n' '{"task":"ci-smoke","exitCode":0}' > /tmp/moonwitness-task.json
          pnpm devx record --input=/tmp/moonwitness-task.json
          pnpm devx flight verify

      - name: Smoke test context freshness lease
        run: |
          pnpm devx context-lease --out=/tmp/moonwitness-context-lease.json --ttl-ms=60000
          pnpm devx context-verify --lease=/tmp/moonwitness-context-lease.json

      - name: Smoke test objective gap watchdog
        run: |
          printf '%s\n' '{"steps":[{"failedTests":["api"],"missingCriteria":["pagination"]},{"failedTests":["api"],"missingCriteria":["pagination"]},{"failedTests":["api"],"missingCriteria":["pagination"]}]}' > /tmp/moonwitness-objective.json
          set +e
          pnpm devx objective-watch --input=/tmp/moonwitness-objective.json --repeat=3
          status=$?
          test "$status" -eq 1

      - name: Smoke test interface treaty checker
        run: |
          printf '%s\n' '{"treaties":[{"id":"api","owner":"api","provides":["User.v1"],"expiresAt":"2099-01-01T00:00:00Z"},{"id":"web","owner":"web","consumes":["User.v1"],"expiresAt":"2099-01-01T00:00:00Z"}]}' > /tmp/moonwitness-treaties.json
          pnpm devx interface-check --plan-file=/tmp/moonwitness-treaties.json

      - name: Smoke test resource passport checker
        run: |
          printf '%s\n' '{"agents":[{"id":"api","resources":{"ports":[3101],"databases":["api"]}},{"id":"web","resources":{"ports":[3102],"databases":["web"]}}]}' > /tmp/moonwitness-resources.json
          pnpm devx resource-check --plan-file=/tmp/moonwitness-resources.json

      - name: Smoke test objective control plane
        run: |
          node --input-type=module -e "import {writeFileSync} from 'node:fs'; writeFileSync('/tmp/moonwitness-objectives.json', JSON.stringify({objectives:[{id:'release',acceptanceCriteria:[{id:'tests'}]}],observations:[{objectiveId:'release',criterionId:'tests',status:'passed',verified:true,evidenceId:'ci',recordedAt:new Date().toISOString()}]}));"
          pnpm devx objective-plane --input=/tmp/moonwitness-objectives.json

      - name: Smoke test interface escrow and merge evidence packet
        run: |
          node --input-type=module -e "import {createInterfaceEscrow,acknowledgeInterfaceEscrow} from './scripts/devx/lib.mjs'; import {writeFileSync} from 'node:fs'; const treaties=[{id:'api',owner:'api',provides:['User.v2'],breakingChanges:['User.v1'],expiresAt:'2099-01-01T00:00:00Z'},{id:'web',owner:'web',consumes:['User.v1'],expiresAt:'2099-01-01T00:00:00Z'}]; let escrow=createInterfaceEscrow({treaties,changeSet:{id:'api-v2',breakingInterfaces:['User.v1'],expiresAt:'2099-01-01T00:00:00Z'}}); escrow=acknowledgeInterfaceEscrow({escrow,consumer:'web',contractFingerprint:escrow.contractFingerprint}); writeFileSync('/tmp/moonwitness-escrow.json',JSON.stringify(escrow));"
          pnpm devx interface-escrow --input=/tmp/moonwitness-escrow.json
          node --input-type=module -e "import {writeFileSync,readFileSync} from 'node:fs'; const escrow=JSON.parse(readFileSync('/tmp/moonwitness-escrow.json')); const input={commitSha:'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',objectives:[{id:'release',acceptanceCriteria:[{id:'tests'}]}],observations:[{objectiveId:'release',criterionId:'tests',status:'passed',verified:true,evidenceId:'ci',recordedAt:new Date().toISOString()}],interfaceEscrow:escrow,agents:[{id:'api',resources:{ports:[3101]}},{id:'web',resources:{ports:[3102]}}],checks:['repository-integrity','asset-integrity','developer-experience','full-workspace-quality'].map(name=>({name,status:'success',runId:1})),evidence:[{id:'ci',sha256:'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'}],rollback:{strategy:'revert',owner:'release-agent',verified:true}}; writeFileSync('/tmp/moonwitness-merge.json',JSON.stringify(input));"
          pnpm devx merge-proof --input=/tmp/moonwitness-merge.json

      - name: Smoke test adaptive swarm topology
        run: |
          printf '%s\n' '{"agents":[{"id":"api","provides":["User.v2"]},{"id":"web","consumes":["User.v2"]}]}' > /tmp/moonwitness-swarm.json
          pnpm devx swarm-plan --input=/tmp/moonwitness-swarm.json

      - name: Smoke test autonomy budget
        run: |
          printf '%s\n' '{"risk":"high","signals":{"collisions":1}}' > /tmp/moonwitness-autonomy.json
          pnpm devx autonomy-budget --input=/tmp/moonwitness-autonomy.json

      - name: Smoke test incident replay compiler
        run: |
          printf '%s\n' '{"incident":{"id":"ci-incident","selectedOperationIds":["notify"],"operations":[{"id":"write","action":"write","invariants":["record-exists"]},{"id":"notify","action":"webhook","dependsOn":["write"],"invariants":["single-delivery"]}]}}' > /tmp/moonwitness-incident.json
          pnpm devx incident-compile --input=/tmp/moonwitness-incident.json

  asset-integrity:
    name: Asset integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Headquarter dependency graph
        run: pnpm install --filter @riotworks/headquarter... --no-frozen-lockfile --ignore-scripts

      - name: Type-check asset package
        run: pnpm --filter @riotworks/assets type-check

      - name: Type-check shared UI package
        run: pnpm --filter @riotworks/ui type-check
      - name: Test shared UI theme contracts
        run: pnpm --filter @riotworks/ui test

      - name: Type-check Headquarter application
        run: pnpm --filter @riotworks/headquarter type-check

      - name: Test Headquarter API boundary, fixtures, and domain engines
        run: pnpm --filter @riotworks/headquarter test

      - name: Build Headquarter production bundle (lint checked separately)
        run: pnpm --filter @riotworks/headquarter exec next build --no-lint

      - name: Validate registry and SVG source assets
        run: node --experimental-strip-types packages/assets/scripts/validate-assets.mjs

      - name: Test asset registry
        run: node --experimental-strip-types --test packages/assets/tests/*.test.mjs

  witness-fabric:
    name: WITNESS FABRIC integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test evidence ledger, replay, and policy-gated actions
        run: node --experimental-strip-types --test packages/witness-fabric/tests/*.test.mjs

      - name: Type-check WITNESS FABRIC
        run: pnpm --filter @moonwitness/witness-fabric type-check

  full-workspace-quality:
    name: Full workspace typecheck and build
    needs: repository-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full workspace validation and production builds
        run: pnpm run validate && pnpm run build

  build-engine-isolation-spike:
    name: Rootless BuildKit isolation and provenance
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/build-engine-isolation-spike-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v7

      - name: Install rootless worker prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y uidmap slirp4netns jq curl python3 shellcheck
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            # This is a disposable GitHub-hosted VM, not a production host.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Shell-check proof script
        run: shellcheck scripts/build-engine-spike/verify.sh

      - name: Run isolated BuildKit proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/build-engine-spike/verify.sh
