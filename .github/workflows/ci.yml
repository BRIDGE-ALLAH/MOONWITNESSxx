name: Repository CI

on:
  push:
    branches:
      - main
      - "feat-*"
      - "fix-*"
      - "chore-*"
      - "feat/**"
      - "fix/**"
      - "chore/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: repository-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moonwitness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moonwitness_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/moonwitness_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Generate repository audit report
        run: pnpm run audit:repo

      - name: Check pnpm lockfile
        run: pnpm run lockfile:check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository, formatting, and automation tests
        run: pnpm run validate:repo

      - name: Upload repository audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: moonwitness-repository-audit
          path: |
            .artifacts/
            pnpm-lock.yaml
          if-no-files-found: ignore
          retention-days: 14

  full-workspace-quality:
    name: Full workspace typecheck and build
    needs: repository-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full validation
        run: pnpm run validate
