name: ARSY PostgreSQL Integration

on:
  pull_request:
    branches: [main, "feat-*", "feat/**", "fix-*", "fix/**"]
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arsy-postgres-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    name: ARSY PostgreSQL persistence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arsy
          POSTGRES_PASSWORD: arsy_test_password
          POSTGRES_DB: arsy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arsy -d arsy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://arsy:arsy_test_password@localhost:5432/arsy_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to isolated PostgreSQL
        run: |
          pnpm --filter @riotworks/arsy migrate:up
          pnpm --filter @riotworks/arsy migrate:up

      - name: Verify persistence across database reconnects
        run: pnpm --filter @riotworks/arsy test:integration
