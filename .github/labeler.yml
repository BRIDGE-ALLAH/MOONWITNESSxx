documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'README.md'
          - 'MASTER-PROMPT'
          - 'docs/**'
          - '*.md'

headquarter:
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/headquarter/**'

arsy:
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/arsy/**'

shared-package:
  - changed-files:
      - any-glob-to-any-file:
          - 'packages/**'

tooling:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - '.husky/**'
          - 'scripts/**'
          - 'package.json'
          - 'pnpm-lock.yaml'
          - 'pnpm-workspace.yaml'
          - 'turbo.json'
