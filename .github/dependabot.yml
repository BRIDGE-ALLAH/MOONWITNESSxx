version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 8
    groups:
      pnpm-tooling:
        patterns:
          - pnpm
          - turbo
          - typescript
          - prettier
      react-ecosystem:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:30'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
