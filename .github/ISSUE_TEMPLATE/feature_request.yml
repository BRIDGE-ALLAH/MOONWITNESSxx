name: Feature request
description: Propose a scoped product or platform improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User or system problem
      description: Describe the need, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: State measurable acceptance criteria.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owning app or package
      placeholder: apps/headquarter or packages/...
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Architecture and API impact
      description: Identify dependencies, data contracts, security boundaries, and alternatives.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Migration and recovery
      description: Describe rollout, compatibility, and rollback needs, or explain why they do not apply.
    validations:
      required: true
