name: Feature proposal
description: Propose a capability with a clear user problem and acceptance criteria.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended outcome
      description: Which user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes that can be verified.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Risks and boundaries
      description: Mention data ownership, security, cost, compliance, or integration implications.
    validations:
      required: false
