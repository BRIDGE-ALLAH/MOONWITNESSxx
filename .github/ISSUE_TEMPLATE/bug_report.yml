name: Bug report
description: Report a reproducible defect in MOONWITNESS
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include exact steps, command, and sanitized logs.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owning app or package
      placeholder: apps/headquarter or packages/...
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and risk
      description: Note security, data, privacy, and recovery impact. Never include secrets.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Expected fix / acceptance evidence
    validations:
      required: true
