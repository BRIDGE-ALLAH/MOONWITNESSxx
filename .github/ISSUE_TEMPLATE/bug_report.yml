name: Bug report
description: Report a reproducible defect in MOONWITNESS.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Keep credentials, personal data, and private URLs out of the report.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What is broken?
      placeholder: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic set of steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Node.js, pnpm, commit SHA
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, credentials, user data, and private endpoints.
    validations:
      required: false
